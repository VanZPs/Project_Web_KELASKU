services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: kelasku-minio

    ports:
      - "9010:9000"
      - "9011:9001"

    environment:
      MINIO_ROOT_USER: kelasku_minio_admin
      MINIO_ROOT_PASSWORD: Password123

    volumes:
      - minio_data:/data

    command: server /data --console-address ":9001"

    restart: unless-stopped

volumes:
  minio_data: